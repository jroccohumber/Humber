      <g transform="translate(92 460)" filter="url(#card-shadow)"><rect width="270" height="250" rx="28" fill="#FFFFFF" /><rect x="0" y="0" width="270" height="8" rx="8" fill="#F5A623" /><text x="34" y="50" font-size="28" font-weight="700" fill="#231F20" text-anchor="start" font-family="Arial, Helvetica, sans-serif"><tspan x="34" dy="0">Sprint Planning</tspan></text><line x1="34" y1="72" x2="236" y2="72" stroke="#EADFCF" stroke-width="1.5" /><circle cx="42" cy="104" r="5" fill="#F5A623" /><text x="58" y="112" font-size="22" font-weight="500" fill="#4D474A" text-anchor="start" font-family="Arial, Helvetica, sans-serif"><tspan x="58" dy="0">Define meta, alcance y plan inicial.</tspan></text><circle cx="42" cy="152" r="5" fill="#F5A623" /><text x="58" y="160" font-size="22" font-weight="500" fill="#4D474A" text-anchor="start" font-family="Arial, Helvetica, sans-serif"><tspan x="58" dy="0">Ordena prioridades y capacidad real.</tspan></text><circle cx="42" cy="200" r="5" fill="#F5A623" /><text x="58" y="208" font-size="22" font-weight="500" fill="#4D474A" text-anchor="start" font-family="Arial, Helvetica, sans-serif"><tspan x="58" dy="0">Resultado: Sprint Goal + backlog.</tspan></text></g><g transform="translate(384 460)" filter="url(#card-shadow)"><rect width="270" height="250" rx="28" fill="#FFFFFF" /><rect x="0" y="0" width="270" height="8" rx="8" fill="#F5A623" /><text x="34" y="50" font-size="28" font-weight="700" fill="#231F20" text-anchor="start" font-family="Arial, Helvetica, sans-serif"><tspan x="34" dy="0">Daily Scrum</tspan></text><line x1="34" y1="72" x2="236" y2="72" stroke="#EADFCF" stroke-width="1.5" /><circle cx="42" cy="104" r="5" fill="#F5A623" /><text x="58" y="112" font-size="22" font-weight="500" fill="#4D474A" text-anchor="start" font-family="Arial, Helvetica, sans-serif"><tspan x="58" dy="0">Sincroniza al equipo en 15 minutos.</tspan></text><circle cx="42" cy="152" r="5" fill="#F5A623" /><text x="58" y="160" font-size="22" font-weight="500" fill="#4D474A" text-anchor="start" font-family="Arial, Helvetica, sans-serif"><tspan x="58" dy="0">Inspecciona avances e impedimentos.</tspan></text><circle cx="42" cy="200" r="5" fill="#F5A623" /><text x="58" y="208" font-size="22" font-weight="500" fill="#4D474A" text-anchor="start" font-family="Arial, Helvetica, sans-serif"><tspan x="58" dy="0">Ajusta el plan diario.</tspan></text></g><g transform="translate(676 460)" filter="url(#card-shadow)"><rect width="270" height="250" rx="28" fill="#FFFFFF" /><rect x="0" y="0" width="270" height="8" rx="8" fill="#F5A623" /><text x="34" y="50" font-size="28" font-weight="700" fill="#231F20" text-anchor="start" font-family="Arial, Helvetica, sans-serif"><tspan x="34" dy="0">Sprint Review</tspan></text><line x1="34" y1="72" x2="236" y2="72" stroke="#EADFCF" stroke-width="1.5" /><circle cx="42" cy="104" r="5" fill="#F5A623" /><text x="58" y="112" font-size="22" font-weight="500" fill="#4D474A" text-anchor="start" font-family="Arial, Helvetica, sans-serif"><tspan x="58" dy="0">Se demuestra el incremento logrado.</tspan></text><circle cx="42" cy="152" r="5" fill="#F5A623" /><text x="58" y="160" font-size="22" font-weight="500" fill="#4D474A" text-anchor="start" font-family="Arial, Helvetica, sans-serif"><tspan x="58" dy="0">Se recoge feedback del negocio.</tspan></text><circle cx="42" cy="200" r="5" fill="#F5A623" /><text x="58" y="208" font-size="22" font-weight="500" fill="#4D474A" text-anchor="start" font-family="Arial, Helvetica, sans-serif"><tspan x="58" dy="0">Se adapta el Product Backlog.</tspan></text></g><g transform="translate(968 460)" filter="url(#card-shadow)"><rect width="270" height="250" rx="28" fill="#FFFFFF" /><rect x="0" y="0" width="270" height="8" rx="8" fill="#F5A623" /><text x="34" y="50" font-size="28" font-weight="700" fill="#231F20" text-anchor="start" font-family="Arial, Helvetica, sans-serif"><tspan x="34" dy="0">Retrospective</tspan></text><line x1="34" y1="72" x2="236" y2="72" stroke="#EADFCF" stroke-width="1.5" /><circle cx="42" cy="104" r="5" fill="#F5A623" /><text x="58" y="112" font-size="22" font-weight="500" fill="#4D474A" text-anchor="start" font-family="Arial, Helvetica, sans-serif"><tspan x="58" dy="0">Revisa cómo trabajó el equipo.</tspan></text><circle cx="42" cy="152" r="5" fill="#F5A623" /><text x="58" y="160" font-size="22" font-weight="500" fill="#4D474A" text-anchor="start" font-family="Arial, Helvetica, sans-serif"><tspan x="58" dy="0">Detecta causas y aprendizajes.</tspan></text><circle cx="42" cy="200" r="5" fill="#F5A623" /><text x="58" y="208" font-size="22" font-weight="500" fill="#4D474A" text-anchor="start" font-family="Arial, Helvetica, sans-serif"><tspan x="58" dy="0">Define mejoras accionables.</tspan></text></g><g transform="translate(1260 460)" filter="url(#card-shadow)"><rect width="248" height="250" rx="28" fill="#FFFFFF" /><rect x="0" y="0" width="248" height="8" rx="8" fill="#F5A623" /><text x="34" y="50" font-size="28" font-weight="700" fill="#231F20" text-anchor="start" font-family="Arial, Helvetica, sans-serif"><tspan x="34" dy="0">Refinement</tspan></text><line x1="34" y1="72" x2="214" y2="72" stroke="#EADFCF" stroke-width="1.5" /><circle cx="42" cy="104" r="5" fill="#F5A623" /><text x="58" y="112" font-size="22" font-weight="500" fill="#4D474A" text-anchor="start" font-family="Arial, Helvetica, sans-serif"><tspan x="58" dy="0">Acompaña todo el sprint.</tspan></text><circle cx="42" cy="152" r="5" fill="#F5A623" /><text x="58" y="160" font-size="22" font-weight="500" fill="#4D474A" text-anchor="start" font-family="Arial, Helvetica, sans-serif"><tspan x="58" dy="0">Aclara historias, riesgos y criterios.</tspan></text><circle cx="42" cy="200" r="5" fill="#F5A623" /><text x="58" y="208" font-size="22" font-weight="500" fill="#4D474A" text-anchor="start" font-family="Arial, Helvetica, sans-serif"><tspan x="58" dy="0">Llega mejor preparado a planning.</tspan></text></g>
    
