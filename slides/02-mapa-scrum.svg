      <text x="92" y="330" font-size="28" font-weight="500" fill="#7E767B" text-anchor="start" font-family="Arial, Helvetica, sans-serif"><tspan x="92" dy="0">Vista general del flujo para explicar cuándo ocurre cada evento</tspan><tspan x="92" dy="36">y qué aporta dentro del sprint.</tspan></text>
      
