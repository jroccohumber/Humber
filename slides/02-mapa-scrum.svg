ransform="translate(902 350)"><circle cx="0" cy="0" r="18" fill="#FFFFFF" stroke="#F5A623" stroke-width="3" /><text x="0" y="8" font-size="16" font-weight="700" fill="#231F20" text-anchor="middle" font-family="Arial, Helvetica, sans-serif"><tspan x="0" dy="0">8</tspan></text></g>
