      <g transform="translate(736 286)" filter="url(#card-shadow)"><rect width="356" height="206" rx="28" fill="#FFFFFF" /><rect x="0" y="0" width="356" height="8" rx="8" fill="#F5A623" /><text x="34" y="50" font-size="28" font-weight="700" fill="#231F20" text-anchor="start" font-family="Arial, Helvetica, sans-serif"><tspan x="34" dy="0">Qué es</tspan></text><line x1="34" y1="72" x2="322" y2="72" stroke="#EADFCF" stroke-width="1.5" /><circle cx="42" cy="104" r="5" fill="#F5A623" /><text x="58" y="112" font-size="22" font-weight="500" fill="#4D474A" text-anchor="start" font-family="Arial, Helvetica, sans-serif"><tspan x="58" dy="0">Marco temporal fijo.</tspan></text><circle cx="42" cy="152" r="5" fill="#F5A623" /><text x="58" y="160" font-size="22" font-weight="500" fill="#4D474A" text-anchor="start" font-family="Arial, Helvetica, sans-serif"><tspan x="58" dy="0">Busca crear un incremento usable.</tspan></text><circle cx="42" cy="200" r="5" fill="#F5A623" /><text x="58" y="208" font-size="22" font-weight="500" fill="#4D474A" text-anchor="start" font-family="Arial, Helvetica, sans-serif"><tspan x="58" dy="0">Hace visible el progreso.</tspan></text></g>
      <g transform="translate(1118 286)" filter="url(#card-shadow)"><rect width="390" height="206" rx="28" fill="#FFFFFF" /><rect x="0" y="0" width="390" height="8" rx="8" fill="#F5A623" /><text x="34" y="50" font-size="28" font-weight="700" fill="#231F20" text-anchor="start" font-family="Arial, Helvetica, sans-serif"><tspan x="34" dy="0">Propósito</tspan></text><line x1="34" y1="72" x2="356" y2="72" stroke="#EADFCF" stroke-width="1.5" /><circle cx="42" cy="104" r="5" fill="#F5A623" /><text x="58" y="112" font-size="22" font-weight="500" fill="#4D474A" text-anchor="start" font-family="Arial, Helvetica, sans-serif"><tspan x="58" dy="0">Entregar valor con frecuencia.</tspan></text><circle cx="42" cy="152" r="5" fill="#F5A623" /><text x="58" y="160" font-size="22" font-weight="500" fill="#4D474A" text-anchor="start" font-family="Arial, Helvetica, sans-serif"><tspan x="58" dy="0">Reducir riesgo mediante inspección.</tspan></text><circle cx="42" cy="200" r="5" fill="#F5A623" /><text x="58" y="208" font-size="22" font-weight="500" fill="#4D474A" text-anchor="start" font-family="Arial, Helvetica, sans-serif"><tspan x="58" dy="0">Aprender rápido con feedback.</tspan></text></g>
      <g transform="translate(736 518)" filter="url(#card-shadow)"><rect width="460" height="220" rx="28" fill="#231F20" /><rect x="0" y="0" width="460" height="8" rx="8" fill="#F5A623" /><text x="34" y="50" font-size="14" font-weight="700" fill="#FFE2B0" text-anchor="start" font-family="Arial, Helvetica, sans-serif" letter-spacing="1.5" opacity="0.95"><tspan x="34" dy="0">MARCO DEL CICLO</tspan></text><text x="34" y="78" font-size="28" font-weight="700" fill="#FFFFFF" text-anchor="start" font-family="Arial, Helvetica, sans-serif"><tspan x="34" dy="0">Reglas clave para contarlo</tspan></text><line x1="34" y1="100" x2="426" y2="100" stroke="#4A4246" stroke-width="1.5" /><circle cx="42" cy="132" r="5" fill="#F5A623" /><text x="58" y="140" font-size="22" font-weight="500" fill="#F5EEE6" text-anchor="start" font-family="Arial, Helvetica, sans-serif"><tspan x="58" dy="0">No se extiende: si falta, se replanifica.</tspan></text><circle cx="42" cy="180" r="5" fill="#F5A623" /><text x="58" y="188" font-size="22" font-weight="500" fill="#F5EEE6" text-anchor="start" font-family="Arial, Helvetica, sans-serif"><tspan x="58" dy="0">Tiene una meta clara: Sprint Goal.</tspan></text><circle cx="42" cy="228" r="5" fill="#F5A623" /><text x="58" y="236" font-size="22" font-weight="500" fill="#F5EEE6" text-anchor="start" font-family="Arial, Helvetica, sans-serif"><tspan x="58" dy="0">Cada evento existe para inspeccionar y adaptar.</tspan></text></g>
