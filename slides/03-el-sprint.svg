      <text x="92" y="182" font-size="15" font-weight="800" fill="#E19112" text-anchor="start" font-family="Arial, Helvetica, sans-serif" letter-spacing="2.0"><tspan x="92" dy="0">CEREMONIA 00</tspan></text>
      <text x="92" y="230" font-size="58" font-weight="800" fill="#231F20" text-anchor="start" font-family="Arial, Helvetica, sans-serif"><tspan x="92" dy="0">El Sprint como contenedor</tspan></text>
      <text x="92" y="330" font-size="28" font-weight="500" fill="#7E767B" text-anchor="start" font-family="Arial, Helvetica, sans-serif"><tspan x="92" dy="0">Todas las ceremonias ocurren dentro del sprint y apuntan a entregar un incremento con valor.</tspan></text>
      
      
