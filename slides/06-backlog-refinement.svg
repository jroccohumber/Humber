        <text x="128" y="474" font-size="26" font-weight="800" fill="#F5A623" text-anchor="start" font-family="Arial, Helvetica, sans-serif"><tspan x="128" dy="0">Práctica continua</tspan></text>
        <text x="128" y="530" font-size="32" font-weight="700" fill="#FFFFFF" text-anchor="start" font-family="Arial, Helvetica, sans-serif"><tspan x="128" dy="0">No es un evento formal del</tspan><tspan x="128" dy="40">Scrum Guide, pero suele ser</tspan><tspan x="128" dy="40">clave para llegar listos a planning.</tspan></text>
        <text x="128" y="674" font-size="22" font-weight="500" fill="#F5EEE6" text-anchor="start" font-family="Arial, Helvetica, sans-serif"><tspan x="128" dy="0">Se usa para aclarar historias, criterios, riesgos,</tspan><tspan x="128" dy="32">dependencias y tamaño antes de comprometerlas.</tspan></text>
