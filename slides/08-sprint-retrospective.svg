      <text x="92" y="230" font-size="58" font-weight="800" fill="#231F20" text-anchor="start" font-family="Arial, Helvetica, sans-serif"><tspan x="92" dy="0">Sprint Retrospective</tspan></text>
      <text x="92" y="330" font-size="28" font-weight="500" fill="#7E767B" text-anchor="start" font-family="Arial, Helvetica, sans-serif"><tspan x="92" dy="0">Espacio de reflexión del equipo para mejorar su forma de trabajar sprint a sprint.</tspan></text>
      
      <g transform="translate(92 326)" filter="url(#card-shadow)"><rect width="250" height="334" rx="30" fill="#FFFFFF" /><rect x="24" y="24" width="202" height="52" rx="18" fill="#FFF2D8" stroke="#F5A623" stroke-width="1.5" /><text x="125" y="57" font-size="26" font-weight="800" fill="#231F20" text-anchor="middle" font-family="Arial, Helvetica, sans-serif"><tspan x="125" dy="0">Seguir</tspan></text><text x="32" y="122" font-size="20" font-weight="500" fill="#7E767B" text-anchor="start" font-family="Arial, Helvetica, sans-serif"><tspan x="32" dy="0">Lo que funcionó y conviene preservar</tspan></text><text x="32" y="208" font-size="22" font-weight="500" fill="#4D474A" text-anchor="start" font-family="Arial, Helvetica, sans-serif"><tspan x="32" dy="0">• Datos y hechos</tspan><tspan x="32" dy="38">• Causas raíz</tspan><tspan x="32" dy="38">• Acciones viables</tspan></text></g><g transform="translate(382 326)" filter="url(#card-shadow)"><rect width="250" height="334" rx="30" fill="#FFFFFF" /><rect x="24" y="24" width="202" height="52" rx="18" fill="#FFF2D8" stroke="#F5A623" stroke-width="1.5" /><text x="125" y="57" font-size="26" font-weight="800" fill="#231F20" text-anchor="middle" font-family="Arial, Helvetica, sans-serif"><tspan x="125" dy="0">Dejar</tspan></text><text x="32" y="122" font-size="20" font-weight="500" fill="#7E767B" text-anchor="start" font-family="Arial, Helvetica, sans-serif"><tspan x="32" dy="0">Prácticas que generan fricción o desperdicio</tspan></text><text x="32" y="208" font-size="22" font-weight="500" fill="#4D474A" text-anchor="start" font-family="Arial, Helvetica, sans-serif"><tspan x="32" dy="0">• Datos y hechos</tspan><tspan x="32" dy="38">• Causas raíz</tspan><tspan x="32" dy="38">• Acciones viables</tspan></text></g><g transform="translate(672 326)" filter="url(#card-shadow)"><rect width="250" height="334" rx="30" fill="#FFFFFF" /><rect x="24" y="24" width="202" height="52" rx="18" fill="#FFF2D8" stroke="#F5A623" stroke-width="1.5" /><text x="125" y="57" font-size="26" font-weight="800" fill="#231F20" text-anchor="middle" font-family="Arial, Helvetica, sans-serif"><tspan x="125" dy="0">Probar</tspan></text><text x="32" y="122" font-size="20" font-weight="500" fill="#7E767B" text-anchor="start" font-family="Arial, Helvetica, sans-serif"><tspan x="32" dy="0">Experimentos concretos para mejorar</tspan></text><text x="32" y="208" font-size="22" font-weight="500" fill="#4D474A" text-anchor="start" font-family="Arial, Helvetica, sans-serif"><tspan x="32" dy="0">• Datos y hechos</tspan><tspan x="32" dy="38">• Causas raíz</tspan><tspan x="32" dy="38">• Acciones viables</tspan></text></g>
      <g transform="translate(980 326)" filter="url(#card-shadow)"><rect width="528" height="198" rx="28" fill="#231F20" /><rect x="0" y="0" width="528" height="8" rx="8" fill="#F5A623" /><text x="34" y="50" font-size="14" font-weight="700" fill="#FFE2B0" text-anchor="start" font-family="Arial, Helvetica, sans-serif" letter-spacing="1.5" opacity="0.95"><tspan x="34" dy="0">MEJORA CONTINUA</tspan></text><text x="34" y="78" font-size="28" font-weight="700" fill="#FFFFFF" text-anchor="start" font-family="Arial, Helvetica, sans-serif"><tspan x="34" dy="0">Resultado ideal</tspan></text><line x1="34" y1="100" x2="494" y2="100" stroke="#4A4246" stroke-width="1.5" /><circle cx="42" cy="132" r="5" fill="#F5A623" /><text x="58" y="140" font-size="22" font-weight="500" fill="#F5EEE6" text-anchor="start" font-family="Arial, Helvetica, sans-serif"><tspan x="58" dy="0">1 a 3 mejoras concretas para el próximo sprint.</tspan></text><circle cx="42" cy="180" r="5" fill="#F5A623" /><text x="58" y="188" font-size="22" font-weight="500" fill="#F5EEE6" text-anchor="start" font-family="Arial, Helvetica, sans-serif"><tspan x="58" dy="0">Dueño claro por acción.</tspan></text><circle cx="42" cy="228" r="5" fill="#F5A623" /><text x="58" y="236" font-size="22" font-weight="500" fill="#F5EEE6" text-anchor="start" font-family="Arial, Helvetica, sans-serif"><tspan x="58" dy="0">Fecha visible para revisar impacto.</tspan></text></g>
      <g transform="translate(980 548)" filter="url(#card-shadow)"><rect width="528" height="186" rx="28" fill="#FFFFFF" /><rect x="0" y="0" width="528" height="8" rx="8" fill="#F5A623" /><text x="34" y="50" font-size="28" font-weight="700" fill="#231F20" text-anchor="start" font-family="Arial, Helvetica, sans-serif"><tspan x="34" dy="0">Tip para presentarla</tspan></text><line x1="34" y1="72" x2="494" y2="72" stroke="#EADFCF" stroke-width="1.5" /><circle cx="42" cy="104" r="5" fill="#F5A623" /><text x="58" y="112" font-size="22" font-weight="500" fill="#4D474A" text-anchor="start" font-family="Arial, Helvetica, sans-serif"><tspan x="58" dy="0">No busca culpables; busca aprendizaje.</tspan></text><circle cx="42" cy="152" r="5" fill="#F5A623" /><text x="58" y="160" font-size="22" font-weight="500" fill="#4D474A" text-anchor="start" font-family="Arial, Helvetica, sans-serif"><tspan x="58" dy="0">Cuanto más específica sea la acción, más útil será.</tspan></text><circle cx="42" cy="200" r="5" fill="#F5A623" /><text x="58" y="208" font-size="22" font-weight="500" fill="#4D474A" text-anchor="start" font-family="Arial, Helvetica, sans-serif"><tspan x="58" dy="0">Cierra el ciclo y conecta con la próxima planning.</tspan></text></g>
    
